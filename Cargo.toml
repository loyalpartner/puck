[workspace]
resolver = "2"
members = ["puck", "puck-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/loyalpartner/puck"

[workspace.dependencies]
nix = { version = "0.29", features = ["ptrace", "signal", "process"] }
libc = "0.2"
thiserror = "2"
goblin = "0.9"
memmap2 = "0.9"
