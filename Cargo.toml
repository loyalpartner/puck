[workspace]
resolver = "2"
members = [
    "hsinject",
    "hsinject-backend",
    "hsinject-cli",
    "tests/test_lib",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["hsinject contributors"]

[workspace.dependencies]
hsinject = { path = "hsinject" }
hsinject-backend = { path = "hsinject-backend" }
nix = { version = "0.29", features = ["ptrace", "signal", "process"] }
libc = "0.2"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
