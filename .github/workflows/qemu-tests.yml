name: QEMU Integration Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Architecture to test'
        required: false
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - aarch64

env:
  CARGO_TERM_COLOR: always

jobs:
  test-x86_64:
    name: x86_64 QEMU Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.architecture != 'aarch64'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Set up Rust
        uses: dtolnay/rust-action@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache QEMU images
        uses: actions/cache@v4
        with:
          path: tests/qemu/images
          key: qemu-images-debian12-x86_64

      - name: Build puck
        run: cargo build --release

      - name: Build test binaries
        run: |
          make -C tests/qemu/labrats all-x86_64
          make -C tests/qemu/payloads all-x86_64

      - name: Download QEMU image
        run: ./tests/qemu/scripts/setup-images.sh x86_64

      - name: Run QEMU tests
        run: uv run pytest tests/qemu/ --arch x86_64 -v --tb=short
        timeout-minutes: 30

  test-aarch64:
    name: aarch64 QEMU Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.architecture == 'aarch64'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-aarch64 \
            qemu-efi-aarch64 \
            gcc-aarch64-linux-gnu

      - name: Set up Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache QEMU images
        uses: actions/cache@v4
        with:
          path: tests/qemu/images
          key: qemu-images-debian12-aarch64

      - name: Build puck for aarch64
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Build test binaries for aarch64
        run: |
          make -C tests/qemu/labrats all-aarch64
          make -C tests/qemu/payloads all-aarch64

      - name: Download QEMU image
        run: ./tests/qemu/scripts/setup-images.sh aarch64

      - name: Run QEMU tests
        run: uv run pytest tests/qemu/ --arch aarch64 -v --tb=short
        timeout-minutes: 60  # aarch64 emulation is much slower
