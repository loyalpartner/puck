name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      puck_release_created: ${{ steps.release.outputs['puck--release_created'] }}
      puck_tag_name: ${{ steps.release.outputs['puck--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.puck_release_created == 'true' }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --package puck-cli
      - uses: actions/upload-artifact@v4
        with:
          name: puck-${{ matrix.target }}
          path: target/release/puck

  upload-release:
    needs: [release-please, build-artifacts]
    if: ${{ needs.release-please.outputs.puck_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.puck_tag_name }} \
            puck-x86_64-unknown-linux-gnu/puck#puck-x86_64-linux \
            puck-aarch64-unknown-linux-gnu/puck#puck-aarch64-linux

  publish-crates:
    needs: release-please
    if: ${{ needs.release-please.outputs.puck_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish puck-rs (library)
        run: cargo publish --package puck-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
