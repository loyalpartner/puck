name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cc: gcc
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cc: gcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build puck
        run: cargo build --release --package puck-cli --target ${{ matrix.target }}

      - name: Build test binaries
        run: |
          make -C tests/qemu/labrats all-${{ matrix.arch }}
          make -C tests/qemu/payloads all-${{ matrix.arch }}

      - name: Run tests
        run: |
          export PUCK_BIN=target/${{ matrix.target }}/release/puck
          sudo $(which uv) run pytest tests/injection -v --tb=short
        timeout-minutes: 10
